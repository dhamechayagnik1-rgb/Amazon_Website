<!DOCTYPE html>
<html lang="en">

<head>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <title>React App</title>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

    const students = [{ name: "yagnik", marks: 75 }];
    let inputone = React.createRef();
    let inputtwo = React.createRef();


    function handleSubmit(event) {
      event.preventDefault();
      const name = inputone.current.value;
      const marks = inputtwo.current.value;
      const newStudents = {
        name: name,
        marks: marks
      };

      students.push(newStudents);
      console.log(students);
      inputone.current.value = "";
      inputtwo.current.value ="";

      rootElement.render(<App />);


    }

    const Form = () => <>
      <h1>Student's form</h1>
      <form onSubmit={handleSubmit} >
        <input ref={inputone} />
        <input ref={inputtwo} />
        <button>submit</button>
      </form>

    </>;

    const Result = () =>
      <table border="1">
        <thead>
          <tr>
            <th>Student's Name</th>
            <th>Marks</th>
          </tr>
        </thead>
        <tbody>
          {students.map((stu, index) => (<tr key={index}>
            <td>{stu.name}</td>
            <td>{stu.marks}</td>
          </tr>))}

        </tbody>
      </table>
      ;

    const App = () => (
      <>
        <Form />
        <Result />

      </>
    );

    const rootElement = ReactDOM.createRoot(document.getElementById("root"));
    rootElement.render(<App />);
  </script>
</body>

</html>
